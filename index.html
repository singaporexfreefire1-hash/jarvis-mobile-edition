<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    var path = window.location.pathname;
    if (!path.endsWith('/')) {
      path += '/';
    }
    window.location.replace(path + 'frontied/');
  </script>
  <meta http-equiv="refresh" content="0; url=./frontied/">
  <title>J.A.R.V.I.S - Redirecting</title>
</head>
<body>
  <p>Redirecting to J.A.R.V.I.S... If you are not redirected automatically, <a href="./frontied/">click here</a>.</p>
</body>
</html>
